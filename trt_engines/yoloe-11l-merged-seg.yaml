# YOLO11 双分支实例分割模型
# 合并通用模型和机械臂微调模型

# 参数
nc: 364

scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 319 layers, 2624080 parameters, 2624064 gradients, 6.6 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 319 layers, 9458752 parameters, 9458736 gradients, 21.7 GFLOPs
  m: [0.50, 1.00, 512] # summary: 409 layers, 20114688 parameters, 20114672 gradients, 68.5 GFLOPs
  l: [1.00, 1.00, 512] # summary: 631 layers, 25372160 parameters, 25372144 gradients, 87.6 GFLOPs
  x: [1.00, 1.50, 512] # summary: 631 layers, 56966176 parameters, 56966160 gradients, 196.0 GFLOPs


# YOLO11n 骨干网络（两个分支共享）
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# 双分支检测头
head:
  # 通用检测分支（来自通用模型）
  - [10, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12, cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15, cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 17
  - [[-1, 13], 1, Concat, [1]] # 18, cat head P4
  - [-1, 2, C3k2, [512, False]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 20
  - [[-1, 10], 1, Concat, [1]] # 21, cat head P5
  - [-1, 2, C3k2, [1024, True]] # 22 (P5/32-large)

  - [[16, 19, 22], 1, YOLOESegment, [363, 32, 256, 512, True]] # 23 - 通用检测头 (P3, P4, P5)

  # 机械臂专用检测分支（来自机械臂微调模型）
  - [10, 1, nn.Upsample, [None, 2, "nearest"]] # 24
  - [[-1, 6], 1, Concat, [1]] # 25, 连接骨干网络P4
  - [-1, 2, C3k2, [512, False]] # 26

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 27
  - [[-1, 4], 1, Concat, [1]] # 28, 连接骨干网络P3
  - [-1, 2, C3k2, [256, False]] # 29 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 30
  - [[-1, 26], 1, Concat, [1]] # 31, 连接head P4
  - [-1, 2, C3k2, [512, False]] # 32 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 33
  - [[-1, 10], 1, Concat, [1]] # 34, 连接head P5
  - [-1, 2, C3k2, [1024, True]] # 35 (P5/32-large)

  - [[29, 32, 35], 1, YOLOESegment, [1, 32, 256, 512, True]] # 36 - 机械臂检测头 (P3, P4, P5)
